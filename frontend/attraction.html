<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細景點頁面</title>
  <link rel="stylesheet" href="/css/attraction.css" />
</head>
<body>
  
  <!-- 導覽列 Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">觀光景點空氣品質展示圖臺</a>
    </div>
  </nav>

  <!-- 主內容容器 Main Container -->
  <main class="main-wrapper">
    <!-- 上半部：圖片與景點資訊 -->
    <section class="overview-section">
      <div class="left-column">
        <!-- 輪播圖容器 -->
        <div class="carousel-container" id="carousel-container">
          <div class="carousel-track" id="carousel-track">
            <!-- 圖片將由 JavaScript 動態載入 -->
          </div>
          <button class="carousel-btn prev-btn" id="prev-btn" aria-label="上一張"></button>
          <button class="carousel-btn next-btn" id="next-btn" aria-label="下一張"></button>
          <div class="carousel-dots" id="carousel-dots">
            <!-- 圓點指示器由 JS 動態生成 -->
          </div>
        </div>

        <div class="attraction-summary">
          <div class="attraction-heading">
            <h1 class="attraction-title" id="attraction-title">景點名稱載入中...</h1>
            <p class="attraction-meta location-meta">
              <span class="location-icon" aria-hidden="true"></span>
              <span id="attraction-city">分類</span> - <span id="attraction-town">捷運站</span>
            </p>
          </div>

          <div class="summary-info">
            <div class="info-block">
              <h4 class="info-title">景點地址</h4>
              <p class="info-content" id="attraction-address">地址載入中...</p>
            </div>

            <div class="info-block">
              <h4 class="info-title">交通方式</h4>
              <p class="info-content" id="attraction-transport">交通資訊載入中...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 景點介紹卡片 -->
      <div class="profile-container">
        <div class="attraction-info-card">
          <div class="info-block">
            <h4 class="info-title">景點介紹</h4>
            <p class="info-content attraction-description" id="attraction-description">
              景點詳細簡介載入中...
            </p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 頁尾 Footer -->
  <footer class="footer">
    <p>COPYRIGHT © 2026 觀光景點空氣品質展示圖臺</p>
  </footer>
  
  <script src="/js/attraction.js"></script>
</body>
</html>
